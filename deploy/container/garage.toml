# Single-node TEST storage. No redundancy. Secrets arrive through garage.env.
metadata_dir = "/data/meta"
data_dir = "/data/objects"
db_engine = "sqlite"
replication_factor = 1
rpc_bind_addr = "127.0.0.1:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "0.0.0.0:3900"
# Path-style API; do not enable public website hosting or publish admin/RPC ports.
