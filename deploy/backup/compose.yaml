# Disposable restore rehearsal. Never shares the application's volumes or ports.
x-garage: &garage
  image: dxflrs/garage:v2.4.1
  command: [/garage, server, --single-node, --default-bucket]
  ports: ['127.0.0.1::3900']
  healthcheck:
    test: [CMD, /garage, health, -q]
    interval: 2s
    timeout: 5s
    retries: 45
  stop_grace_period: 15s

services:
  source:
    <<: *garage
    environment:
      GARAGE_CONFIG_FILE: /etc/garage.toml
      GARAGE_RPC_SECRET: ${SOURCE_RPC_SECRET:?}
      GARAGE_DEFAULT_ACCESS_KEY: ${SOURCE_ACCESS_KEY:?}
      GARAGE_DEFAULT_SECRET_KEY: ${SOURCE_SECRET_KEY:?}
      GARAGE_DEFAULT_BUCKET: adtrender-test-source
    volumes:
      - ../container/garage.toml:/etc/garage.toml:ro
      - source_meta:/data/meta
      - source_objects:/data/objects

  target:
    <<: *garage
    environment:
      GARAGE_CONFIG_FILE: /etc/garage.toml
      GARAGE_RPC_SECRET: ${TARGET_RPC_SECRET:?}
      GARAGE_DEFAULT_ACCESS_KEY: ${TARGET_ACCESS_KEY:?}
      GARAGE_DEFAULT_SECRET_KEY: ${TARGET_SECRET_KEY:?}
      GARAGE_DEFAULT_BUCKET: adtrender-restore-test
    volumes:
      - ../container/garage.toml:/etc/garage.toml:ro
      - target_meta:/data/meta
      - target_objects:/data/objects

volumes:
  source_meta:
  source_objects:
  target_meta:
  target_objects:
